    <linearGradient id="h" x1="0" x2="1"><stop offset="0" stop-color="#b7d6e6" stop-opacity="0"/><stop offset=".5" stop-color="#e6f2f8"/><stop offset="1" stop-color="#b7d6e6" stop-opacity="0"/></linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b7d6e6" stop-opacity="0"/><stop offset=".5" stop-color="#e6f2f8"/><stop offset="1" stop-color="#b7d6e6" stop-opacity="0"/></linearGradient>
